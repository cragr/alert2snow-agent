# Default values for alert2snow-agent

replicaCount: 2

image:
  repository: quay.io/cragr/alert2snow-agent
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  # runAsUser omitted - let OpenShift assign UID from namespace range
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# ServiceNow configuration
servicenow:
  baseUrl: ""
  endpointPath: "/api/now/table/incident"
  username: ""
  password: ""
  # Incident field defaults
  category: "software"
  subcategory: "openshift"
  assignmentGroup: ""  # Optional: ServiceNow assignment group sys_id or name
  callerId: ""         # Optional: ServiceNow caller sys_id or user_name
  rootCause: "Environmental"  # Root cause value for resolved incidents
  urgency: "3"         # Incident urgency (1=High, 2=Medium, 3=Low)
  impact: "3"          # Incident impact (1=High, 2=Medium, 3=Low)

# Application configuration
config:
  httpPort: "8080"
  clusterLabelKey: "cluster"
  environmentLabelKey: "environment"
  # DNS suffix for OpenShift console links, used as apps.<cluster>.<domain> when
  # the domain cannot be derived from the alert's GeneratorURL. Left empty the
  # console link is omitted rather than emitted with a guessed (dead) domain.
  consoleBaseDomain: ""

nodeSelector: {}

tolerations: []

affinity: {}

# Prometheus Operator integration. Enable only against a build whose metrics are
# actually incremented; scraping a no-op build yields authoritative-looking zeros.
metrics:
  # ServiceMonitor so the platform Prometheus scrapes /metrics.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels required by some Prometheus instances for selection.
    additionalLabels: {}
    # Set to the namespace's Prometheus when using user-workload monitoring.
    honorLabels: false
  # PrometheusRule with the alerting rules that make delivery failure visible.
  prometheusRule:
    enabled: false
    additionalLabels: {}
    # Fraction of ServiceNow requests failing before alerting.
    errorRatioThreshold: 0.1

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
